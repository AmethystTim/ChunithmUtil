<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>CHUNITHM Utils 帮助</title>
  <style>
    @font-face { font-family: ChuHelp; src: url("{{ font_uri }}") format("truetype"); }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px;
      background: #edf1f8;
      color: #24314a;
      font-family: ChuHelp, "Noto Sans CJK SC", sans-serif;
      font-size: 24px;
      line-height: 1.65;
    }
    main {
      padding: 40px 44px;
      background: #fff;
      border-top: 10px solid #7655c9;
      border-radius: 18px;
    }
    h1 { margin: 0 0 10px; color: #503794; font-size: 48px; line-height: 1.3; }
    h2 { margin: 36px 0 16px; padding-left: 16px; border-left: 6px solid #7655c9; font-size: 30px; }
    p { margin: 14px 0; }
    strong { color: #503794; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 18px 0; }
    th, td { padding: 14px 18px; border: 1px solid #dde3ed; text-align: left; vertical-align: top; }
    th { background: #eee8fa; color: #503794; }
    th:first-child { width: 54%; }
    tr:nth-child(even) td { background: #f7f8fc; }
    code { padding: 2px 6px; background: #eef1f7; border-radius: 5px; font-size: 21px; font-family: "DejaVu Sans Mono", ChuHelp, monospace; overflow-wrap: anywhere; }
    blockquote { margin: 20px 0; padding: 4px 20px; border-left: 5px solid #9b7adc; background: #f5f1fb; }
    hr { margin: 28px 0 20px; border: 0; border-top: 1px solid #dde3ed; }
  </style>
</head>
<body><main>{{ content }}</main></body>
</html>
